# (2026-11-04) Mantiene los números de base de la página iguales a las tarifas de Superpepe.
# Ver scripts/actualizar-tarifas.mjs. Repo público: los minutos de Actions no cuestan.
name: Tarifas de Superpepe en la página

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: tarifas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar-tarifas.mjs
      - name: Publicar si cambiaron
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Tarifas Pepe"
          git config user.email "titular@pepeconductores.com"
          git commit -am "Tarifas al día desde Superpepe (automático)"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
