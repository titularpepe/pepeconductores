<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Seguimiento en vivo · Pepe</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, Roboto, Arial, sans-serif; background: #0c0c0c; }
    #mapa { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
    #barra {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(12,12,12,0.92); color: #fff; padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
    }
    #barra b { color: #FFD700; }
    #estado { font-size: 13px; color: #bbb; margin-left: auto; }
    #aviso {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      z-index: 1000; background: rgba(12,12,12,0.95); color: #fff; padding: 22px 26px;
      border-radius: 14px; text-align: center; max-width: 300px; display: none;
    }
    .pin-emoji { font-size: 34px; text-align: center; line-height: 34px; }
    /* (2026-10-01) Autito como en la app (assets/images/auto_conductor.png de pepe-pasajeros) */
    .auto-pepe { width: 48px; height: 48px; transition: transform 0.6s ease; }
    .auto-pepe svg { display: block; }
  </style>
</head>
<body>
  <div id="mapa"></div>
  <div id="barra">📍 <span><b id="nombre">Viaje</b> en vivo</span><span id="estado">conectando…</span></div>
  <div id="aviso"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBkDvFeRdzrR1NsrMyieSy-x9P_PkF7gUs",
      authDomain: "pepe-conductores.firebaseapp.com",
      projectId: "pepe-conductores",
      storageBucket: "pepe-conductores.firebasestorage.app",
      messagingSenderId: "443201366396",
      appId: "1:443201366396:web:bca7754157145474fb9cf9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const id = new URLSearchParams(location.search).get('id');
    const aviso = document.getElementById('aviso');
    const estadoEl = document.getElementById('estado');
    const nombreEl = document.getElementById('nombre');

    function mostrarAviso(txt) { aviso.style.display = 'block'; aviso.textContent = txt; }

    if (!id) {
      mostrarAviso('Link inválido. Pedí que te compartan el viaje de nuevo.');
    } else {
      const mapa = L.map('mapa', { zoomControl: true }).setView([-24.7859, -65.4117], 14); // Salta por defecto
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap'
      }).addTo(mapa);

      // Mientras espera al conductor se muestra la persona; durante el viaje el pasajero va
      // adentro del auto, así que se muestra el autito girando según el rumbo (calculado con la
      // posición anterior; movimientos de menos de 8 m no lo giran, es ruido del GPS).
      const iconoPersona = L.divIcon({ className: '', html: '<div class="pin-emoji">🖐️</div>', iconSize: [34, 34], iconAnchor: [17, 17] });
      const iconoAuto = L.divIcon({ className: '', html: '<div class="auto-pepe"><svg width="48" height="48" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="carro" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#d9d9d9"/><stop offset="0.25" stop-color="#ffffff"/><stop offset="0.75" stop-color="#ffffff"/><stop offset="1" stop-color="#d0d0d0"/></linearGradient><filter id="sombra" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#000" flood-opacity="0.45"/></filter></defs><g filter="url(#sombra)"><rect x="17" y="14" width="4" height="9" rx="1.5" fill="#222"/><rect x="43" y="14" width="4" height="9" rx="1.5" fill="#222"/><rect x="17" y="41" width="4" height="9" rx="1.5" fill="#222"/><rect x="43" y="41" width="4" height="9" rx="1.5" fill="#222"/><rect x="19" y="6" width="26" height="52" rx="10" fill="url(#carro)" stroke="#9a9a9a" stroke-width="0.8"/></g><path d="M22.5 22 Q32 16.5 41.5 22 L39.5 28.5 Q32 26 24.5 28.5 Z" fill="#2b3440"/><rect x="24.5" y="29.5" width="15" height="14" rx="3" fill="#f2f2f2" stroke="#c8c8c8" stroke-width="0.6"/><rect x="24.5" y="34.5" width="15" height="4" fill="#FFD700"/><path d="M24.5 45 Q32 47 39.5 45 L41 50.5 Q32 53.5 23 50.5 Z" fill="#2b3440"/><rect x="21.5" y="7.5" width="6" height="2.6" rx="1.2" fill="#fff7b0"/><rect x="36.5" y="7.5" width="6" height="2.6" rx="1.2" fill="#fff7b0"/><rect x="21.5" y="54.2" width="5.5" height="2.2" rx="1" fill="#e53935"/><rect x="37" y="54.2" width="5.5" height="2.2" rx="1" fill="#e53935"/><rect x="16.5" y="24" width="3" height="2.4" rx="1" fill="#e0e0e0" stroke="#9a9a9a" stroke-width="0.5"/><rect x="44.5" y="24" width="3" height="2.4" rx="1" fill="#e0e0e0" stroke="#9a9a9a" stroke-width="0.5"/></svg></div>', iconSize: [48, 48], iconAnchor: [24, 24] });
      const TEXTO_ESTADO = { aceptado: 'esperando al auto 🟢', llegue: 'el auto llegó 🟢', comprando: 'el conductor está comprando 🟢', en_viaje: 'en viaje 🟢' };
      let marcador = null;
      let enAuto = null;
      let primero = true;
      let ultimaPos = null;
      let rumbo = 0;

      function girarAuto() {
        const el = marcador && marcador.getElement() && marcador.getElement().querySelector('.auto-pepe');
        if (el) el.style.transform = 'rotate(' + rumbo + 'deg)';
      }

      db.collection('tracking').doc(id).onSnapshot((snap) => {
        if (!snap.exists) {
          estadoEl.textContent = 'sin señal';
          mostrarAviso('El viaje terminó o todavía no empezó a compartirse.');
          return;
        }
        aviso.style.display = 'none';
        const d = snap.data();
        if (typeof d.lat !== 'number' || typeof d.lng !== 'number') return;
        const pos = [d.lat, d.lng];
        if (d.nombre) nombreEl.textContent = d.nombre;
        estadoEl.textContent = TEXTO_ESTADO[d.estado] || 'en vivo 🟢';

        if (ultimaPos) {
          const rad = Math.PI / 180;
          const dLat = (d.lat - ultimaPos[0]) * 111320;
          const dLng = (d.lng - ultimaPos[1]) * 111320 * Math.cos(d.lat * rad);
          if (Math.hypot(dLat, dLng) >= 8) { rumbo = (Math.atan2(dLng, dLat) / rad + 360) % 360; ultimaPos = pos; }
        } else {
          ultimaPos = pos;
        }

        const debeIrEnAuto = d.estado === 'en_viaje';
        if (!marcador) {
          marcador = L.marker(pos, { icon: debeIrEnAuto ? iconoAuto : iconoPersona }).addTo(mapa);
        } else {
          marcador.setLatLng(pos);
          if (debeIrEnAuto !== enAuto) marcador.setIcon(debeIrEnAuto ? iconoAuto : iconoPersona);
        }
        enAuto = debeIrEnAuto;
        if (enAuto) girarAuto();
        if (primero) { mapa.setView(pos, 16); primero = false; }
        else mapa.panTo(pos);
      }, () => {
        estadoEl.textContent = 'error';
        mostrarAviso('No se pudo cargar el seguimiento.');
      });
    }
  </script>
</body>
</html>
