<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' *.gstatic.com *.googleapis.com https://www.google.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' *.googleapis.com *.gstatic.com https://www.google.com; frame-src https://www.google.com https://recaptcha.google.com;">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pepe — Videos para compartir</title>
<meta name="description" content="Elegí un video o una foto de Pepe, miralo y compartilo en Instagram, TikTok, Facebook o WhatsApp.">
<meta property="og:title" content="Pepe — Videos para compartir">
<meta property="og:description" content="Elegí un video, miralo y compartilo en tus redes.">
<meta property="og:image" content="https://pepeconductores.com/android-chrome-512x512.png">
<meta property="og:url" content="https://pepeconductores.com/videos/">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --negro: #0c0c0c;
  --blanco: #f7f4ee;
  --amarillo: #f5d800;
  --naranja: #ff4d00;
  --rojo: #ff2d55;
  --gris: #161616;
  --gris2: #222;
  --texto-apagado: rgba(247,244,238,0.6);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--negro); color: var(--blanco); font-family: 'Barlow', sans-serif; min-height: 100vh; }
header { padding: 1.4rem 16px 1rem; text-align: center; border-bottom: 1px solid rgba(245,216,0,0.12); }
.logo { font-family: 'Barlow Condensed', sans-serif; font-size: 2.2rem; font-weight: 900; color: var(--amarillo); text-decoration: none; }
header h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1.5rem; margin-top: .2rem; }
header p { color: var(--texto-apagado); margin-top: .3rem; font-size: .95rem; }
main { max-width: 1100px; margin: 0 auto; padding: 1.2rem 16px 3rem; }

/* GRILLA */
.grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.tarjeta { background: var(--gris); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left; color: inherit; font: inherit; padding: 0; transition: transform .15s, border-color .15s; }
.tarjeta:hover { transform: translateY(-2px); border-color: rgba(245,216,0,0.5); }
.tarjeta .mini { position: relative; aspect-ratio: 9/16; background: var(--gris2); }
.tarjeta .mini img, .tarjeta .mini video { width: 100%; height: 100%; object-fit: cover; display: block; }
.tarjeta .etiqueta { position: absolute; top: 8px; left: 8px; background: var(--amarillo); color: var(--negro); font-size: .7rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; }
.tarjeta .cifras { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.6rem .6rem .5rem; background: linear-gradient(transparent, rgba(0,0,0,.75)); display: flex; gap: .8rem; font-size: .85rem; font-weight: 700; text-shadow: 0 1px 2px #000; }
.tarjeta .titulo { padding: .6rem .7rem .7rem; font-weight: 600; font-size: .92rem; line-height: 1.25; }
.vacio { text-align: center; color: var(--texto-apagado); padding: 4rem 1rem; }

/* VISOR (estilo TikTok) */
.visor { position: fixed; inset: 0; background: #000; z-index: 50; display: none; overflow: hidden; touch-action: none; }
.visor.abierto { display: block; }
.escena { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.escena video, .escena img { max-width: 100%; max-height: 100%; width: auto; height: 100%; object-fit: contain; display: block; }
@media (min-aspect-ratio: 3/4) { .escena video, .escena img { height: 100%; } }
.sombra-abajo { position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background: linear-gradient(transparent, rgba(0,0,0,.7)); pointer-events: none; }
.cerrar { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; z-index: 3; background: rgba(0,0,0,.45); border: none; color: #fff; width: 42px; height: 42px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; }
.sonido { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; z-index: 3; background: rgba(0,0,0,.45); border: none; color: #fff; height: 42px; padding: 0 14px; border-radius: 21px; font: inherit; font-weight: 700; cursor: pointer; display: none; }
.pausa { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 4rem; color: rgba(255,255,255,.8); pointer-events: none; display: none; }
.corazon-grande { position: absolute; top: 50%; left: 50%; font-size: 6.5rem; pointer-events: none; transform: translate(-50%,-50%) scale(0); opacity: 0; color: var(--rojo); text-shadow: 0 4px 20px rgba(0,0,0,.4); }
.corazon-grande.anima { animation: latido .8s ease-out; }
@keyframes latido { 0% { transform: translate(-50%,-50%) scale(0); opacity: 1; } 25% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; } 45% { transform: translate(-50%,-50%) scale(.95); } 100% { transform: translate(-50%,-60%) scale(1); opacity: 0; } }

.riel { position: absolute; right: 10px; bottom: calc(110px + env(safe-area-inset-bottom)); z-index: 3; display: flex; flex-direction: column; gap: 18px; align-items: center; }
.accion { background: none; border: none; color: #fff; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.accion .ico { width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; transition: transform .15s; }
.accion:active .ico { transform: scale(.88); }
.accion .num { font-size: .85rem; font-weight: 700; }
.accion.megusta .ico { color: #fff; }
.accion.megusta.activo .ico { color: var(--rojo); }
.accion.vistas { cursor: default; }
.accion.compartir .ico { background: var(--amarillo); color: var(--negro); }

.pie { position: absolute; left: 14px; right: 84px; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 3; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
.pie .marca { color: var(--amarillo); font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 1.1rem; }
.pie h2 { font-size: 1.05rem; font-weight: 700; margin: .1rem 0 .25rem; }
.pie p { font-size: .9rem; line-height: 1.35; white-space: pre-wrap; max-height: 4.1em; overflow: hidden; }
.pie p.abierto { max-height: 40vh; overflow-y: auto; }
.progreso { position: absolute; left: 0; right: 0; bottom: env(safe-area-inset-bottom); height: 3px; background: rgba(255,255,255,.2); z-index: 3; }
.progreso div { height: 100%; width: 0; background: var(--amarillo); }
.flechas { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 10px; z-index: 3; }
.flechas button { width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,.15); color: #fff; font-size: 1.2rem; cursor: pointer; }
.flechas button:disabled { opacity: .25; cursor: default; }
@media (hover: hover) and (min-width: 700px) { .flechas { display: flex; } .riel { right: calc(50% - 300px); } .pie { left: calc(50% - 290px); right: calc(50% - 220px); } }
.pista { position: absolute; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(0,0,0,.6); padding: .5rem .9rem; border-radius: 20px; font-size: .85rem; z-index: 3; pointer-events: none; white-space: nowrap; transition: opacity .4s; }

/* HOJA DE COMPARTIR */
.hoja-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: none; }
.hoja-fondo.abierta { display: block; }
.hoja { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--gris); border-radius: 18px 18px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); }
.hoja .agarre { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 0 auto 12px; }
.hoja h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 1.3rem; text-align: center; margin-bottom: 12px; }
.botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: none; border-radius: 10px; padding: .85rem .6rem; font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn:disabled { opacity: .6; cursor: wait; }
.btn-principal { grid-column: 1 / -1; background: var(--amarillo); color: var(--negro); font-size: 1.05rem; padding: 1rem; }
.btn-wa { background: #25d366; color: #0c0c0c; }
.btn-fb { background: #1877f2; color: #fff; }
.btn-gris { background: var(--gris2); color: var(--blanco); }
.ayuda { margin-top: 12px; font-size: .85rem; color: var(--texto-apagado); line-height: 1.45; }
.ayuda b { color: var(--blanco); }
.aviso { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--amarillo); color: var(--negro); font-weight: 700; padding: .7rem 1.1rem; border-radius: 8px; z-index: 70; display: none; max-width: calc(100% - 32px); text-align: center; }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">PEPE</a>
  <h1>Videos para compartir</h1>
  <p>Tocá uno, miralo, dale ❤ y compartilo en Instagram, TikTok, Facebook o WhatsApp.</p>
</header>

<main>
  <div class="grilla" id="grilla"></div>
  <p class="vacio" id="vacio">Cargando…</p>
</main>

<div class="visor" id="visor" role="dialog" aria-modal="true">
  <div class="escena" id="escena"></div>
  <div class="sombra-abajo"></div>
  <div class="pausa" id="pausa">▶</div>
  <div class="corazon-grande" id="corazonGrande">❤</div>
  <button class="cerrar" id="cerrar" aria-label="Cerrar">✕</button>
  <button class="sonido" id="sonido">🔇 Tocá para el sonido</button>
  <div class="riel">
    <button class="accion megusta" id="btnMeGusta" aria-label="Me gusta"><span class="ico">❤</span><span class="num" id="numMeGusta">0</span></button>
    <div class="accion vistas" title="Reproducciones"><span class="ico">▶</span><span class="num" id="numVistas">0</span></div>
    <button class="accion compartir" id="btnAbrirHoja" aria-label="Compartir"><span class="ico">➦</span><span class="num" id="numCompartidos">Compartir</span></button>
  </div>
  <div class="pie">
    <div class="marca">@pepe</div>
    <h2 id="visorTitulo"></h2>
    <p id="visorTexto"></p>
  </div>
  <div class="flechas"><button id="anterior" aria-label="Anterior">▲</button><button id="siguiente" aria-label="Siguiente">▼</button></div>
  <div class="progreso"><div id="barra"></div></div>
  <div class="pista" id="pista">Deslizá hacia arriba para ver otro</div>
</div>

<div class="hoja-fondo" id="hojaFondo">
  <div class="hoja" id="hoja">
    <div class="agarre"></div>
    <h3>Compartir</h3>
    <div class="botones">
      <button class="btn btn-principal" id="btnCompartir">Compartir</button>
      <a class="btn btn-wa" id="btnWa" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn btn-fb" id="btnFb" target="_blank" rel="noopener">Facebook</a>
      <a class="btn btn-gris" id="btnBajar" download>Descargar</a>
      <button class="btn btn-gris" id="btnCopiar">Copiar texto</button>
    </div>
    <p class="ayuda" id="ayuda"></p>
  </div>
</div>
<div class="aviso" id="aviso"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const SITIO = 'https://pepeconductores.com';
const $ = id => document.getElementById(id);
let lista = [];
let indice = -1;          // video abierto en el visor
let actual = null;
let archivoListo = null;  // File listo para compartir (se baja al abrir la hoja)
let descarga = null;

// ---- Contadores (Firestore videos_web/{id}: vistas, likes, compartidos) ----
let db = null;
const cifras = {};        // id -> { vistas, likes, compartidos }
const vistasContadas = new Set();
let misLikes = new Set();
try { misLikes = new Set(JSON.parse(localStorage.getItem('pepeVideosLikes') || '[]')); } catch (e) {}
function guardarLikes() { try { localStorage.setItem('pepeVideosLikes', JSON.stringify([...misLikes])); } catch (e) {} }

try {
  firebase.initializeApp({
    apiKey: "AIzaSyBkDvFeRdzrR1NsrMyieSy-x9P_PkF7gUs",
    authDomain: "pepe-conductores.firebaseapp.com",
    projectId: "pepe-conductores",
    storageBucket: "pepe-conductores.firebasestorage.app",
    messagingSenderId: "443201366396",
    appId: "1:443201366396:web:bca7754157145474fb9cf9"
  });
  if (/pepeconductores\.com$/.test(location.hostname)) {
    firebase.appCheck().activate(new firebase.appCheck.ReCaptchaEnterpriseProvider('6LfHkfEtAAAAAGmQsxm3pGZTKFvBmE4UdMEVLtz1'), true);
  }
  db = firebase.firestore();
} catch (e) { db = null; }

function cifrasDe(id) { return cifras[id] || (cifras[id] = { vistas: 0, likes: 0, compartidos: 0 }); }
function sumar(id, campo, cuanto) {
  const c = cifrasDe(id); c[campo] = Math.max(0, (c[campo] || 0) + cuanto);
  pintarCifras(id);
  if (!db) return;
  const inc = firebase.firestore.FieldValue.increment(cuanto);
  db.collection('videos_web').doc(id).set({ [campo]: inc }, { merge: true }).catch(() => {});
}
async function cargarCifras() {
  if (!db) return;
  try {
    const snap = await db.collection('videos_web').get();
    snap.forEach(d => { const x = d.data(); cifras[d.id] = { vistas: x.vistas || 0, likes: x.likes || 0, compartidos: x.compartidos || 0 }; });
    lista.forEach(it => pintarCifras(it.id));
  } catch (e) {}
}

const fmt = new Intl.NumberFormat('es-AR', { notation: 'compact', maximumFractionDigits: 1 });
function n(x) { return fmt.format(x || 0); }

function pintarCifras(id) {
  const c = cifrasDe(id);
  const t = document.querySelector('.tarjeta[data-id="' + CSS.escape(id) + '"] .cifras');
  if (t) t.innerHTML = '<span>▶ ' + n(c.vistas) + '</span><span>❤ ' + n(c.likes) + '</span>';
  if (actual && actual.id === id) {
    $('numMeGusta').textContent = n(c.likes);
    $('numVistas').textContent = n(c.vistas);
    $('numCompartidos').textContent = c.compartidos ? n(c.compartidos) : 'Compartir';
    $('btnMeGusta').classList.toggle('activo', misLikes.has(id));
  }
}

// ---- Avisos y helpers ----
const puedeCompartirArchivos = (() => {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'x.mp4', { type: 'video/mp4' })] })); }
  catch (e) { return false; }
})();
function avisar(txt) {
  const a = $('aviso'); a.textContent = txt; a.style.display = 'block';
  clearTimeout(avisar.t); avisar.t = setTimeout(() => a.style.display = 'none', 2600);
}
function linkDe(item) { return SITIO + '/videos/v/' + item.id + '.html'; }
function textoDe(item) { return (item.texto || item.titulo || '').trim(); }

// ---- Grilla ----
async function cargar() {
  try {
    const r = await fetch('lista.json?t=' + Date.now(), { cache: 'no-store' });
    lista = await r.json();
  } catch (e) { lista = []; }
  const g = $('grilla'); g.innerHTML = '';
  if (!lista.length) { $('vacio').textContent = 'Todavía no hay videos. Volvé pronto.'; return; }
  $('vacio').hidden = true;
  lista.forEach((item, i) => {
    const t = document.createElement('button');
    t.className = 'tarjeta'; t.dataset.id = item.id;
    const mini = document.createElement('div'); mini.className = 'mini';
    if (item.miniatura) {
      const img = document.createElement('img'); img.loading = 'lazy'; img.alt = ''; img.src = 'archivos/' + item.miniatura; mini.appendChild(img);
    } else if (item.tipo === 'video') {
      const v = document.createElement('video'); v.muted = true; v.preload = 'metadata'; v.src = 'archivos/' + item.archivo + '#t=0.5'; mini.appendChild(v);
    } else {
      const img = document.createElement('img'); img.loading = 'lazy'; img.alt = ''; img.src = 'archivos/' + item.archivo; mini.appendChild(img);
    }
    if (item.tipo !== 'video') { const e = document.createElement('div'); e.className = 'etiqueta'; e.textContent = 'Foto'; mini.appendChild(e); }
    const c = document.createElement('div'); c.className = 'cifras'; mini.appendChild(c);
    const ti = document.createElement('div'); ti.className = 'titulo'; ti.textContent = item.titulo || 'Sin título';
    t.append(mini, ti);
    t.onclick = () => abrir(i, true);
    g.appendChild(t);
    pintarCifras(item.id);
  });
  cargarCifras();
  const pedido = new URLSearchParams(location.search).get('v');
  if (pedido) { const i = lista.findIndex(x => x.id === pedido); if (i >= 0) abrir(i, false); }
}

// ---- Visor ----
function abrir(i, cambiarUrl) {
  if (i < 0 || i >= lista.length) return;
  indice = i; actual = lista[i];
  const item = actual;
  const escena = $('escena'); escena.innerHTML = '';
  $('barra').style.width = '0';
  $('pausa').style.display = 'none';
  $('sonido').style.display = 'none';
  const src = 'archivos/' + item.archivo;
  if (item.tipo === 'video') {
    const v = document.createElement('video');
    v.playsInline = true; v.loop = true; v.preload = 'auto'; v.src = src;
    if (item.miniatura) v.poster = 'archivos/' + item.miniatura;
    v.ontimeupdate = () => {
      if (v.duration) $('barra').style.width = (v.currentTime * 100 / v.duration) + '%';
      if (v.currentTime >= 2 && !vistasContadas.has(item.id)) { vistasContadas.add(item.id); sumar(item.id, 'vistas', 1); }
    };
    escena.appendChild(v);
    v.play().catch(() => { v.muted = true; v.play().catch(() => {}); $('sonido').style.display = 'block'; });
  } else {
    const img = document.createElement('img'); img.src = src; img.alt = item.titulo || ''; escena.appendChild(img);
    if (!vistasContadas.has(item.id)) { vistasContadas.add(item.id); setTimeout(() => { if (actual === item) sumar(item.id, 'vistas', 1); }, 1500); }
  }
  $('visorTitulo').textContent = item.titulo || '';
  $('visorTexto').textContent = item.texto || '';
  $('visorTexto').classList.remove('abierto');
  $('anterior').disabled = i === 0;
  $('siguiente').disabled = i === lista.length - 1;
  pintarCifras(item.id);
  $('visor').classList.add('abierto');
  document.body.style.overflow = 'hidden';
  const url = '?v=' + encodeURIComponent(item.id);
  if (cambiarUrl === true) history.pushState({ v: item.id }, '', url);
  else if (cambiarUrl === 'reemplazar') history.replaceState({ v: item.id }, '', url);
  if (lista.length > 1 && !abrir.pistaVista) {
    abrir.pistaVista = true; const p = $('pista'); p.style.opacity = 1;
    setTimeout(() => p.style.opacity = 0, 2800);
  } else { $('pista').style.opacity = 0; }
}

function videoActual() { return $('escena').querySelector('video'); }

function cerrar() {
  cerrarHoja();
  $('escena').innerHTML = '';
  actual = null; indice = -1;
  $('visor').classList.remove('abierto');
  document.body.style.overflow = '';
}
function pedirCerrar() {
  if (history.state && history.state.v) history.back();
  else { cerrar(); history.replaceState(null, '', location.pathname); }
}
function mover(paso) {
  const j = indice + paso;
  if (j < 0 || j >= lista.length) return;
  abrir(j, 'reemplazar');
}

$('cerrar').onclick = pedirCerrar;
$('anterior').onclick = () => mover(-1);
$('siguiente').onclick = () => mover(1);
$('sonido').onclick = () => { const v = videoActual(); if (v) { v.muted = false; v.play().catch(() => {}); } $('sonido').style.display = 'none'; };
$('visorTexto').onclick = e => { e.stopPropagation(); $('visorTexto').classList.toggle('abierto'); };

document.addEventListener('keydown', e => {
  if (!actual) return;
  if (e.key === 'Escape') { if ($('hojaFondo').classList.contains('abierta')) cerrarHoja(); else pedirCerrar(); }
  else if (e.key === 'ArrowDown') mover(1);
  else if (e.key === 'ArrowUp') mover(-1);
  else if (e.key === ' ') { e.preventDefault(); alternarPausa(); }
});
window.addEventListener('popstate', () => {
  const id = new URLSearchParams(location.search).get('v');
  const i = id ? lista.findIndex(x => x.id === id) : -1;
  if (i >= 0) abrir(i, false); else cerrar();
});

// Toque: uno = pausa, dos seguidos = me gusta. Deslizar arriba/abajo = otro video.
function alternarPausa() {
  const v = videoActual(); if (!v) return;
  if (v.paused) { v.play().catch(() => {}); $('pausa').style.display = 'none'; }
  else { v.pause(); $('pausa').style.display = 'block'; }
}
let toqueInicio = null, ultimoToque = 0, timerToque = null;
const escenaZona = $('visor');
escenaZona.addEventListener('pointerdown', e => {
  if (e.target.closest('.riel, .cerrar, .sonido, .flechas, .pie')) return;
  toqueInicio = { x: e.clientX, y: e.clientY, t: Date.now() };
});
escenaZona.addEventListener('pointerup', e => {
  if (!toqueInicio) return;
  const dx = e.clientX - toqueInicio.x, dy = e.clientY - toqueInicio.y;
  toqueInicio = null;
  if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx)) { mover(dy < 0 ? 1 : -1); return; }
  if (Math.abs(dx) > 15 || Math.abs(dy) > 15) return;
  const ahora = Date.now();
  if (ahora - ultimoToque < 300) {
    clearTimeout(timerToque); ultimoToque = 0;
    corazonGrande();
    if (!misLikes.has(actual.id)) darMeGusta();
  } else {
    ultimoToque = ahora;
    timerToque = setTimeout(alternarPausa, 300);
  }
});
escenaZona.addEventListener('wheel', e => {
  if ($('hojaFondo').classList.contains('abierta')) return;
  if (Math.abs(e.deltaY) < 30 || Date.now() - (escenaZona._rueda || 0) < 600) return;
  escenaZona._rueda = Date.now(); mover(e.deltaY > 0 ? 1 : -1);
}, { passive: true });

function corazonGrande() {
  const c = $('corazonGrande'); c.classList.remove('anima'); void c.offsetWidth; c.classList.add('anima');
}
function darMeGusta() {
  const id = actual.id;
  if (misLikes.has(id)) { misLikes.delete(id); guardarLikes(); sumar(id, 'likes', -1); }
  else { misLikes.add(id); guardarLikes(); sumar(id, 'likes', 1); }
}
$('btnMeGusta').onclick = () => { if (!misLikes.has(actual.id)) corazonGrande(); darMeGusta(); };

// ---- Hoja de compartir ----
function abrirHoja() {
  const item = actual; if (!item) return;
  const txt = textoDe(item);
  const src = 'archivos/' + item.archivo;
  $('btnWa').href = 'https://wa.me/?text=' + encodeURIComponent((txt ? txt + '\n\n' : '') + linkDe(item));
  $('btnFb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(linkDe(item));
  $('btnBajar').href = src;
  $('btnBajar').setAttribute('download', item.archivo);
  $('btnCopiar').hidden = !txt;
  const que = item.tipo === 'video' ? 'el video' : 'la foto';
  if (puedeCompartirArchivos) {
    $('ayuda').innerHTML = '<b>Instagram o TikTok:</b> tocá el botón amarillo y elegí la app. El texto se copia solo: pegalo en la descripción.<br><b>WhatsApp o Facebook:</b> con el amarillo mandás ' + que + '; con el verde o el azul mandás el link.';
    prepararArchivo(item);
  } else {
    $('btnCompartir').textContent = 'Copiar link';
    $('btnCompartir').disabled = false;
    $('ayuda').innerHTML = '<b>Instagram o TikTok:</b> tocá <b>Descargar</b> y subí ' + que + ' desde la app (o entrá a esta página desde el celular).<br><b>WhatsApp o Facebook:</b> usá los botones verde y azul.';
  }
  const v = videoActual(); if (v && !v.paused) { v.pause(); }
  $('hojaFondo').classList.add('abierta');
}
function cerrarHoja() {
  if (descarga) descarga.abort();
  archivoListo = null;
  if (!$('hojaFondo').classList.contains('abierta')) return;
  $('hojaFondo').classList.remove('abierta');
  const v = videoActual(); if (v && $('pausa').style.display !== 'block') v.play().catch(() => {});
}
$('btnAbrirHoja').onclick = abrirHoja;
$('hojaFondo').addEventListener('click', e => { if (e.target === $('hojaFondo')) cerrarHoja(); });

// Compartir un archivo necesita tenerlo descargado ANTES del toque (si no, el navegador
// rechaza el share por falta de "gesto del usuario"). Se baja apenas se abre la hoja.
async function prepararArchivo(item) {
  const b = $('btnCompartir');
  b.disabled = true; b.textContent = 'Preparando…';
  archivoListo = null;
  if (descarga) descarga.abort();
  descarga = new AbortController();
  try {
    const r = await fetch('archivos/' + item.archivo, { signal: descarga.signal });
    if (!r.ok) throw new Error(r.status);
    const total = +r.headers.get('content-length') || 0;
    const lector = r.body.getReader(); const partes = []; let llevo = 0;
    for (;;) {
      const { done, value } = await lector.read();
      if (done) break;
      partes.push(value); llevo += value.length;
      if (total) b.textContent = 'Preparando… ' + Math.round(llevo * 100 / total) + '%';
    }
    if (actual !== item) return;
    const tipo = r.headers.get('content-type') || (item.tipo === 'video' ? 'video/mp4' : 'image/jpeg');
    archivoListo = new File(partes, item.archivo, { type: tipo.split(';')[0] });
    b.disabled = false; b.textContent = item.tipo === 'video' ? 'Compartir video' : 'Compartir foto';
  } catch (e) {
    if (e.name === 'AbortError' || actual !== item) return;
    b.disabled = false; b.textContent = 'Compartir link';
  }
}

function copiar(txt) {
  if (!txt) return Promise.resolve(false);
  return navigator.clipboard ? navigator.clipboard.writeText(txt).then(() => true, () => false) : Promise.resolve(false);
}
function contarCompartido() { if (actual) sumar(actual.id, 'compartidos', 1); }

$('btnCompartir').onclick = async () => {
  if (!actual) return;
  const txt = textoDe(actual);
  if (archivoListo && navigator.canShare && navigator.canShare({ files: [archivoListo] })) {
    copiar(txt);
    try { await navigator.share({ files: [archivoListo], text: txt || undefined }); contarCompartido(); }
    catch (e) { if (e.name !== 'AbortError') avisar('No se pudo compartir. Probá con Descargar.'); }
    return;
  }
  if (navigator.share) {
    try { await navigator.share({ title: actual.titulo, text: txt || undefined, url: linkDe(actual) }); contarCompartido(); } catch (e) {}
    return;
  }
  if (await copiar((txt ? txt + '\n\n' : '') + linkDe(actual))) { avisar('Link copiado. Pegalo donde quieras.'); contarCompartido(); }
};
$('btnWa').addEventListener('click', contarCompartido);
$('btnFb').addEventListener('click', contarCompartido);
$('btnBajar').addEventListener('click', contarCompartido);
$('btnCopiar').onclick = async () => {
  if (await copiar(textoDe(actual))) avisar('Texto copiado'); else avisar('No se pudo copiar');
};

cargar();
</script>
